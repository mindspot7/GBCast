name: Android
# Builds the GBCast release APK from the Flycast core and the GBFrame submodule.

on:
  push:
  pull_request:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Set up ccache
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: Disable release signing
        run: sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/' shell/android-studio/flycast/build.gradle.kts

      - name: Bump version code
        run: sed -i 's/versionCode = 8/versionCode = ${{ github.run_number }}/' shell/android-studio/flycast/build.gradle.kts

      - name: Gradle
        working-directory: shell/android-studio
        # APK only. The App Bundle (.aab) is built for an official numbered release, when asked for.
        run: ./gradlew assembleRelease --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: gbcast-release
          path: shell/android-studio/flycast/build/outputs/apk/release/*.apk
