name: Android
# Builds the GBCast release APK from the Flycast core and the GBFrame submodule.
# Run manually or by committing the dedicated trigger file, only after GBFrame passes.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
    paths:
      - .github/workflows/run-build.trigger

jobs:
  build:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Set up ccache
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: Gradle
        working-directory: shell/android-studio
        env:
          GBCAST_VERSION_CODE: ${{ github.run_number }}
        # CI-only values are passed as Gradle properties; tracked source stays unchanged.
        # APK only. The App Bundle (.aab) is built for an official numbered release, when asked for.
        run: ./gradlew :flycast:testDebugUnitTest :flycast:assembleRelease --parallel -PgbcastVersionCode="$GBCAST_VERSION_CODE" -PgbcastCiDebugSigning=true

      - name: Name APK with app version
        id: apk
        run: |
          VERSION=$(git describe --tags --always)
          NAME="GBCast-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          APK_DIR="shell/android-studio/flycast/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          mv "$APK" "$APK_DIR/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify APK 16 KB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="shell/android-studio/flycast/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign -print | sort -V | tail -n 1)
          if [ -z "$ZIPALIGN" ]; then
            echo "::error::Android zipalign tool not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Inspect native ELF 16 KB page alignment
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="shell/android-studio/flycast/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p "$RUNNER_TEMP/gbcast-native-libs"
          unzip -o -q "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/gbcast-native-libs"
          shopt -s nullglob
          LIBS=("$RUNNER_TEMP"/gbcast-native-libs/lib/arm64-v8a/*.so)
          if [ "${#LIBS[@]}" -eq 0 ]; then
            echo "::error title=16 KB ELF::No arm64-v8a shared libraries found in APK"
            exit 1
          fi
          OBJDUMP=$(find "$ANDROID_HOME/ndk" -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump' -type f -print | sort -V | tail -n 1)
          if [ -z "$OBJDUMP" ]; then
            echo "::error::llvm-objdump not found in Android NDK"
            exit 1
          fi
          FAILURES=0
          for LIB in "${LIBS[@]}"; do
            ALIGNMENTS=$("$OBJDUMP" -p "$LIB" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
            if [[ "$ALIGNMENTS" == *"2**12"* ]]; then
              echo "::error title=16 KB ELF::$(basename "$LIB") has a LOAD segment aligned to 4 KB ($ALIGNMENTS)"
              FAILURES=$((FAILURES + 1))
            else
              echo "::notice title=16 KB ELF::$(basename "$LIB") LOAD alignment: $ALIGNMENTS"
            fi
          done
          echo "Inspected ${#LIBS[@]} arm64-v8a shared libraries; 4 KB LOAD-alignment failures: $FAILURES"
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::Native ELF alignment check failed for $FAILURES shared libraries"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: shell/android-studio/flycast/build/outputs/apk/release/${{ steps.apk.outputs.name }}.apk
