name: Android # 16 KB validator parsing fix
# Builds the GBCast release APK from the Flycast core and the GBFrame submodule.
# Run manually or by committing the dedicated trigger file, only after GBFrame passes.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
    paths:
      - .github/workflows/run-build.trigger

jobs:
  build:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Set up ccache
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: Gradle
        working-directory: shell/android-studio
        env:
          GBCAST_VERSION_CODE: ${{ github.run_number }}
        # CI-only values are passed as Gradle properties; tracked source stays unchanged.
        # APK only. The App Bundle (.aab) is built for an official numbered release, when asked for.
        run: ./gradlew :flycast:testDebugUnitTest :flycast:compileDebugAndroidTestJavaWithJavac :flycast:assembleRelease --parallel -PgbcastVersionCode="$GBCAST_VERSION_CODE" -PgbcastCiDebugSigning=true

      - name: Set up Android SDK for managed emulator
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator system image
        run: |
          set -euo pipefail
          # `yes` may exit with SIGPIPE after sdkmanager has accepted all licenses;
          # do not let pipefail treat that expected early close as a setup failure.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator"

      - name: Boot managed Android emulator with bounded ADB recovery
        shell: bash
        run: |
          set -euo pipefail
          # Hosted Linux runners may expose /dev/kvm without granting the runner
          # account access. This is an ephemeral CI VM; make KVM accessible here.
          if [[ -e /dev/kvm ]]; then
            echo "KVM permissions before adjustment:"
            ls -l /dev/kvm
            id
            sudo chmod 666 /dev/kvm
            echo "KVM permissions after adjustment:"
            ls -l /dev/kvm
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              echo "The runner still cannot read/write /dev/kvm after permission adjustment."
              exit 1
            fi
          else
            echo "No /dev/kvm device is exposed by this runner; x86_64 emulator startup may fail."
            exit 1
          fi
          # Resolve the SDK from the actual sdkmanager location. The runner's
          # inherited ANDROID_HOME can point at /usr/local/lib instead of the SDK root.
          SDKMANAGER_PATH="$(readlink -f "$(command -v sdkmanager)")"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER_PATH")"
          SDK_ROOT="$(cd "$SDKMANAGER_DIR/../../.." && pwd)"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$SDK_ROOT/emulator:$SDK_ROOT/platform-tools:$SDKMANAGER_DIR:$PATH"
          AVDMANAGER="$SDKMANAGER_DIR/avdmanager"
          if [[ ! -x "$SDK_ROOT/emulator/emulator" || ! -x "$AVDMANAGER" ]]; then
            echo "Android emulator or avdmanager binary is missing under SDK root $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 \( -type f -o -type l \) \( -name emulator -o -name avdmanager \) -print || true
            exit 1
          fi
          echo "Resolved Android SDK root: $SDK_ROOT"
          echo "AVD home: $ANDROID_AVD_HOME"
          printf '%s\n' no | "$AVDMANAGER" create avd --force --name gbcast-ci-api34 --package "system-images;android-34;google_apis;x86_64" --device "pixel_2"
          "$AVDMANAGER" list avd
          if [[ ! -f "$ANDROID_AVD_HOME/gbcast-ci-api34.ini" ]]; then
            echo "AVD creation did not produce $ANDROID_AVD_HOME/gbcast-ci-api34.ini"
            find "$ANDROID_USER_HOME" -maxdepth 4 -type f -name "*.ini" -print || true
            exit 1
          fi
          "$SDK_ROOT/emulator/emulator" -avd gbcast-ci-api34 -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -wipe-data > "$RUNNER_TEMP/gbcast-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$RUNNER_TEMP/gbcast-emulator.pid"
          adb start-server
          deadline=$((SECONDS + 360))
          connected=false
          while (( SECONDS < deadline )); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before ADB connected."
              cat "$RUNNER_TEMP/gbcast-emulator.log"
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              connected=true
              break
            fi
            adb reconnect offline >/dev/null 2>&1 || true
            sleep 5
          done
          if [[ "$connected" != true ]]; then
            echo "Timed out after 6 minutes waiting for an online ADB device."
            adb devices -l || true
            cat "$RUNNER_TEMP/gbcast-emulator.log"
            exit 1
          fi
          boot_deadline=$((SECONDS + 180))
          until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            if (( SECONDS >= boot_deadline )); then
              echo "Timed out waiting for Android boot completion."
              adb devices -l || true
              cat "$RUNNER_TEMP/gbcast-emulator.log"
              exit 1
            fi
            sleep 3
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run SET/CLEAR receiver instrumentation tests
        working-directory: shell/android-studio
        run: ./gradlew --no-daemon :flycast:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.flycast.emulator.RetroAchievementsHostOverrideReceiverTest --stacktrace

      - name: Stop managed Android emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/gbcast-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/gbcast-emulator.pid")" >/dev/null 2>&1 || true
          fi
          if [[ -f "$RUNNER_TEMP/gbcast-emulator.log" ]]; then
            tail -n 200 "$RUNNER_TEMP/gbcast-emulator.log"
          fi

      - name: Name APK with app version
        id: apk
        run: |
          VERSION=$(git describe --tags --always)
          NAME="GBCast-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          APK_DIR="shell/android-studio/flycast/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          mv "$APK" "$APK_DIR/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate APK 16 KB compatibility (GBFrame shared validator)
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR="$RUNNER_TEMP/check-android-16kb.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/mindspot7/GBFrame/6fb96ecac381cf7613b7e3321ade39b73b052fd0/tools/check-android-16kb.sh" \
            -o "$VALIDATOR"
          APK_DIR="shell/android-studio/flycast/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          bash "$VALIDATOR" "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: shell/android-studio/flycast/build/outputs/apk/release/${{ steps.apk.outputs.name }}.apk
